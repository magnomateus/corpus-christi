<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img" aria-label="Mockup placeholder do ebook 150 Moldes de Tapetes para Corpus Christi">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AB8E0"/>
      <stop offset="100%" stop-color="#5A9BC8"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3F7BA8"/>
      <stop offset="100%" stop-color="#5A9BC8"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feFlood flood-color="#2D4A6B" flood-opacity="0.35"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="240" cy="490" rx="180" ry="10" fill="#2D4A6B" opacity="0.18"/>

  <g filter="url(#bookShadow)">
    <rect x="78" y="40" width="22" height="420" fill="url(#spine)"/>
    <rect x="100" y="36" width="304" height="428" rx="4" fill="url(#cover)"/>
    <rect x="118" y="56" width="268" height="388" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35"/>
  </g>

  <g transform="translate(252,180)" fill="#D4A656">
    <rect x="-8" y="-58" width="16" height="118" rx="2"/>
    <rect x="-32" y="-18" width="64" height="16" rx="2"/>
    <circle cx="0" cy="-58" r="6" opacity="0.85"/>
  </g>

  <text x="252" y="290" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">150</text>
  <text x="252" y="320" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">MOLDES DE TAPETES</text>
  <text x="252" y="345" text-anchor="middle" font-family="Montserrat,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="1.8" opacity="0.92">PARA CORPUS CHRISTI</text>

  <line x1="170" y1="375" x2="334" y2="375" stroke="#D4A656" stroke-width="1.5" opacity="0.85"/>

  <text x="252" y="402" text-anchor="middle" font-family="'Open Sans',Arial,sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85" letter-spacing="1.2">PRONTOS PARA IMPRIMIR</text>
  <text x="252" y="420" text-anchor="middle" font-family="'Open Sans',Arial,sans-serif" font-size="11" fill="#FFFFFF" opacity="0.85" letter-spacing="1.2">E MONTAR</text>

  <text x="240" y="510" text-anchor="middle" font-family="monospace" font-size="9" fill="#8A9BB0" opacity="0.55">placeholder — substituir por mockup real (PNG)</text>
</svg>
